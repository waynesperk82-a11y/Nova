name: NOVA validation

on:
  pull_request:
    branches:
      - fix/nova-web-vercel-build
  push:
    branches:
      - feature/supabase-device-storage

permissions:
  contents: read

jobs:
  app-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run check
      - name: Expo web export
        run: npm run export:web
